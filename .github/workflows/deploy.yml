name: Deploy to Cloudflare

on:
  push:
    branches:
      - deployment

  # Allow manual trigger — deploys all services
  workflow_dispatch:

jobs:
  # ─── Detect which services changed ───
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend-auth: ${{ steps.filter.outputs.backend-auth }}
      backend-ticketing: ${{ steps.filter.outputs.backend-ticketing }}
      backend-telegram: ${{ steps.filter.outputs.backend-telegram }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            backend-auth:
              - 'backend-auth/**'
            backend-ticketing:
              - 'backend-ticketing/**'
            backend-telegram:
              - 'backend-telegram/**'
            frontend:
              - 'frontend/**'

  # ─── Backend API Worker (api.furban.my.id) ───
  deploy-backend:
    name: Deploy Backend Worker
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

  # ─── Auth Worker (auth.furban.my.id) ───
  deploy-backend-auth:
    name: Deploy Auth Worker
    needs: changes
    if: needs.changes.outputs.backend-auth == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend-auth
        run: npm ci

      - name: Sync GOOGLE_CLIENT_ID to Cloudflare Worker secret
        working-directory: backend-auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          echo "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-auth
          command: deploy

  # ─── Ticketing Worker (ticket.furban.my.id) ───
  deploy-backend-ticketing:
    name: Deploy Ticketing Worker
    needs: changes
    if: needs.changes.outputs.backend-ticketing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend-ticketing
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-ticketing
          command: deploy

  # ─── Telegram Bot Worker (backend-telegram) ───
  deploy-backend-telegram:
    name: Deploy Telegram Bot Worker
    needs: changes
    if: needs.changes.outputs.backend-telegram == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: backend-telegram
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend-telegram
          command: deploy

  # ─── Frontend (Cloudflare Pages — furban.my.id) ───
  deploy-frontend:
    name: Deploy Frontend (Pages)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
          VITE_TICKET_API_BASE_URL: ${{ secrets.TICKET_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=furban-web --branch=development
          workingDirectory: frontend
