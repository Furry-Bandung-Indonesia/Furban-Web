name = "backend-auth"
main = "src/index.ts"
compatibility_date = "2024-12-04"

# Custom domain route
routes = [
  { pattern = "auth.furban.my.id", custom_domain = true }
]

# D1 Database for auth service
[[d1_databases]]
binding = "DB"
database_name = "furban-auth-db"
database_id = "61eddd31-9927-48ed-aaf0-d9a84d4d3162"

# KV -> on progress
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "session-kv-id-placeholder"

# R2 for avatars
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "furban-media"

[vars]
JWT_SECRET = "dev-secret-key-change-in-prod"
JWT_EXPIRE_HOURS = "48"
SESSION_EXPIRE_HOURS = "3"
FRONTEND_URL = "https://furban.my.id"
TURNSTILE_BYPASS = "true"
