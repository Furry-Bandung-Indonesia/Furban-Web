name = "furban-backend"
main = "src/index.ts"
compatibility_date = "2024-12-04"

# Custom domain route
routes = [
  { pattern = "api.furban.my.id", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "furban-db"
database_id = "4c6f79ab-9bf5-4f59-a823-ab66c7c3601b"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "furban-media"

[vars]
FRONTEND_URL = "https://furban.my.id"
# JWT_SECRET — set via `wrangler secret put JWT_SECRET` or GitHub Actions