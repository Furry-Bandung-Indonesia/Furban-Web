<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FurBan Community</title>

    <!-- SEO Meta -->
    <meta name="description" content="Furban Community – Bandung's furry community platform. Share photos, blogs, and connect with fellow furries in a creative space built for the community.">
    <meta name="theme-color" content="#10BEC5">

    <!-- Open Graph (Facebook, Discord, WhatsApp, Telegram, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://furban.my.id/">
    <meta property="og:title" content="Furban Community – Bandung's Creative Furry Platform">
    <meta property="og:description" content="Join Bandung's furry community! Share photos, publish blogs, and connect with fellow furries in a creative space built for the community by the community.">
    <meta property="og:image" content="https://furban.my.id/banner.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Furban Community – Bandung's Furry Platform">
    <meta property="og:site_name" content="Furban Community">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Furban Community – Bandung's Creative Furry Platform">
    <meta name="twitter:description" content="Join Bandung's furry community! Share photos, publish blogs, and connect with fellow furries in a creative space built for the community by the community.">
    <meta name="twitter:image" content="https://furban.my.id/banner.png">

    <!-- Cloudflare Turnstile -->
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>

    <!-- Google Identity Services -->
    <link rel="preconnect" href="https://accounts.google.com">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #192838;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .dark-mode #loading-overlay {
        background-color: #111827;
        color: white;
      }
      
      #loading-overlay img {
        width: 120px;
        height: auto;
        margin-bottom: 20px;
      }
      
      #loading-overlay p {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        color: #4b5563;
      }
      
      .dark-mode #loading-overlay p {
        color: #e5e7eb;
      }
      
      .loading-spinner {
        margin-top: 15px;
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top-color: #3b82f6;
        animation: spin 1s ease-in-out infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <img src="/furban.png" alt="Furban Logo">
      <p>Loading assets...</p>
      <div class="loading-spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Check if dark mode is enabled in localStorage
      const isDarkMode = localStorage.getItem('theme') === 'dark';
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
      }
      
      // Hide loading overlay after 1 seconds
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingOverlay = document.getElementById('loading-overlay');
          if (loadingOverlay) {
            loadingOverlay.style.opacity = '0';
            setTimeout(function() {
              loadingOverlay.style.display = 'none';
            }, 500);
          }
        }, 1000);
      });
    </script>
    <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e391524d25f64987a663afe6726c938f"}'></script><!-- End Cloudflare Web Analytics -->
  </body>
</html>
